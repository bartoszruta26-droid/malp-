name: MALP Android build

on:
  push:
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android 34 platform
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Run Android unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Install and smoke-test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: >-
            bash -euo pipefail -c 'APK="$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk"; test -s "$APK" || { echo "Expected APK not found: $APK"; find "$GITHUB_WORKSPACE" -type f -name "*.apk" -print || true; exit 1; }; adb wait-for-device; adb shell getprop sys.boot_completed | grep -q 1; adb install "$APK"; adb logcat -c; adb shell am start -W -n org.gateshipone.malp/.application.activities.MainActivity; adb shell am force-stop org.gateshipone.malp; adb logcat -c; adb shell am start -W -n org.gateshipone.malp/.application.activities.MainActivity -a android.intent.action.SEND -t text/plain --es android.intent.extra.TEXT "https://youtu.be/dQw4w9WgXcQ"; adb shell am force-stop org.gateshipone.malp; adb logcat -c; adb shell am start -W -n org.gateshipone.malp/.application.activities.MainActivity -a android.intent.action.SEND_MULTIPLE -t text/plain --es android.intent.extra.TEXT "https://youtu.be/dQw4w9WgXcQ"; adb shell am force-stop org.gateshipone.malp; if adb logcat -d -s AndroidRuntime:E | grep -q "FATAL EXCEPTION"; then adb logcat -d -s AndroidRuntime:E; exit 1; fi'
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: malp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
